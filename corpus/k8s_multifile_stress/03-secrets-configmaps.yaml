# Service accounts and secrets for the platform
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service-sa
  namespace: platform-core
  labels:
    app: api-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: platform-core
  labels:
    app: background-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: monitoring
  labels:
    app: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: monitoring
  labels:
    app: grafana
---
# THE VULNERABLE SA — this gets bound to the overprivileged ClusterRole
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-processor-sa
  namespace: analytics
  labels:
    app: analytics-processor
    team: data-engineering
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx-sa
  namespace: ingress-system
  labels:
    app: ingress-nginx
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-sa
  namespace: cert-manager
  labels:
    app: cert-manager
---
