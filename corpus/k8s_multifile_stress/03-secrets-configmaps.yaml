---
# ConfigMaps
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: platform-core
data:
  database.pool.max: "20"
  database.pool.min: "5"
  cache.ttl.seconds: "300"
  cors.allowed.origins: "https://app.enterprise.com,https://admin.enterprise.com"
  log.level: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags
  namespace: platform-core
data:
  ENABLE_NEW_CHECKOUT: "true"
  ENABLE_DARK_MODE: "true"
  ENABLE_ANALYTICS_V2: "true"
  MAX_UPLOAD_SIZE_MB: "50"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
      - job_name: 'api-service'
        static_configs:
          - targets: ['api-service.platform-core.svc:8080']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboard.json: |
    {"title": "Platform Overview", "panels": [{"type": "graph", "title": "Request Rate"}]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: analytics
data:
  BATCH_SIZE: "1000"
  EXPORT_FORMAT: "parquet"
  DATA_LAKE_BUCKET: "s3://enterprise-data-lake"
  RETENTION_DAYS: "365"
  PII_COLUMNS: "email,phone,ssn,address"

